services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: skill_radar
      POSTGRES_USER: skill_radar
      POSTGRES_PASSWORD: skill_radar
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skill_radar"]
      interval: 2s
      timeout: 2s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
